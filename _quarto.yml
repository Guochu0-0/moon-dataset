# 文档站。一条命令构建：`quarto render`，产出在 _site/ 并**随仓库提交**——
# 验收标准是「克隆后双击首页即可阅读，无需安装任何工具」。
project:
  type: website
  output-dir: _site

  # 显式列出要渲染的文件。不列的话 Quarto 会把仓库里每个 .md 都当成一页，
  # README.md、data/README.md、docs/agents/*.md（那是给 agent 的约定，不是文档站内容）
  # 全都会混进站点与搜索索引里。
  render:
    - index.qmd
    - CONTEXT.md
    - docs/*.qmd
    - docs/rois/*.md

  # ROI 档案页是生成物：渲染前按仓库里的输入重新生成一遍，免得渲染出过期的页面。
  # 只读仓库，不碰数据盘。理由详见 moondata/roipages.py。
  pre-render:
    - python -m moondata pages

  # Quarto 的搜索在运行时 fetch("search.json")，双击打开时走 file:// 会被同源策略
  # 拦下。这一步把索引嵌进 JS，让搜索不必起服务器。理由详见 moondata/docsite.py。
  post-render:
    - python -m moondata.docsite

# Quarto 界面文案走简体中文（搜索框、目录标题、上/下一页等）。
lang: zh

website:
  title: "月球光学–SAR 配准数据集"
  description: "CE-2 7 m DOM × Mini-RF SAR 配准数据集的说明材料"
  search:
    location: navbar
    type: overlay
    copy-button: false # 复制链接对一份离线 file:// 站点没有意义
  navbar:
    left:
      - href: index.qmd
        text: 首页
      - href: CONTEXT.md
        text: 术语表
      - href: docs/sources.qmd
        text: 来源文档
      - href: docs/products.qmd
        text: 产物文档
      - href: docs/rois/index.md
        text: ROI 档案
  sidebar:
    style: floating
    collapse-level: 2
    contents:
      - href: index.qmd
        text: 首页
      - href: CONTEXT.md
        text: 术语表
      # 三份主体文档各由自己的 issue 产出。尚未产出的只占位、不给链接——导航树要能让人
      # 一眼看出整份材料由哪几块组成，但点进去是首页会更让人困惑。
      - section: "主体文档"
        contents:
          - href: docs/sources.qmd
            text: 来源文档
          - text: "流程文档（尚未产出，见 issue #11）"
          - href: docs/products.qmd
            text: 产物文档
          # 六十几页不逐一列进导航树，从总览页的表格点进去
          - href: docs/rois/index.md
            text: ROI 档案
      - href: docs/dataset-study.qmd
        text: 数据集特性研究（本轮未产出）
  page-footer:
    center: "数据集已冻结。本站构建产物随仓库提交，可离线阅读。"

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    code-copy: true
    link-external-newwindow: true
    # 站点要能双击打开，所以一个字节都不能从 CDN 取。
    # Quarto 默认就把 JS/CSS 拷进 site_libs/，这里钉死，免得将来被某个选项翻掉。
    resources-from-cdn: false
