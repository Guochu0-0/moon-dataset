[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moondata"
version = "0.2.0"
description = "从 CE-2 7 m DOM 与 Mini-RF SAR 的原始输入做出配准数据集"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "markdown>=3.4", "pillow"]

# GDAL/pyproj 不在这里：它们用 pip 装在 Windows 上经常失败，由 environment.yml 从
# conda-forge 提供。

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
