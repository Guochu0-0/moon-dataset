# 本仓库唯一的环境：两个编号脚本、素材脚本、站点生成器与测试都用它。
#
#   conda env create -f environment.yml --solver=libmamba
#   conda activate moon-dataset
#
# GDAL 与 pyproj 只从 conda-forge 装，不用 pip 装。
name: moon-dataset
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24
  - gdal>=3.6
  - pyproj>=3.5
  - markdown>=3.4   # 站点生成器
  - pillow          # 素材脚本
  - pytest
  - pip
  - pip:
      - -e .
