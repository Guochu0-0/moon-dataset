[[issue]]
title = "局部错位，错开的距离随位置变化"
rois = ["ROI_9"]
text = """2026-09-11 的配对检验抽样时几乎找不到可信匹配，随后把 162 对全部跑了一遍：29 对（18%）找到了\
可信匹配（对照组 ROI_12 为 70%）。纹理指数与对照组相近（光学 3.39 / 2.52 对 3.62 / 2.58），\
排除了纹理平淡。找到匹配的 patch 显示并没有配错片，但 SAR 相对光学的横向偏移**分段变化**：

| 光学窗口所在行 | 偏移 dx（像素） |
|---|---|
| 3072 ~ 5632 | 一对都没找到 |
| 6144 ~ 8704 | +88 ~ +128 |
| 9216 ~ 14848 | −96 ~ −108 |
| 15360 ~ 17920 | −188 ~ −216 |
| 18432 ~ 24064 | −64 ~ +36 |

对齐控制点的拟合残差中位 73 px、最大 227 px。原因未查明，**待本人复核。**"""
source = "2026-09-11 数据核查会话（配对检验，全量）"

[[issue]]
title = "对齐控制点重标过，patch 重新编号"
rois = ["ROI_73"]
text = """旧数据是双重错误：光学影像用了错误坐标（偏离约 205 km），而 `opt_tie.*` 实际标在 ROI_74 的影像上\
（存错了文件夹）。2026-09-11 在修正后的影像上重标了 30 对点（`data/tie-points/ROI_73/cropped_2/`），\
重切得到 119 对，原 98 对已删除，编号重新从零排起。

窗口清单 `data/windows/windows_train.json` 里本 ROI 的 98 个窗口是按旧的错误控制点算的，\
正向复现**不要求**与之一致。"""
source = "旧迁移记录 `MIGRATION.md`；`data/README.md`"

[[issue]]
