# ROI 的已知问题——档案页里唯一手写的部分。
#
# 档案页由 `moondata pages` 从元数据表、统计快照、缩略图清单和本文件生成（`quarto render`
# 会先自动跑一遍）。本文件只记**别处推不出来**的事实：人看出来的、查出来的、当时决定的。
#
# 约定：
# - **照实记录，不做解释。** 原因没查清的就写「原因未查明」，不要把猜测写成结论——
#   旧参考文档里就有一处把局部错位归因于地形、后来被推翻的例子。
# - 每条写明出处（source）。出处是会话记录的，注明日期；那些记录不在仓库里。
# - `rois` 用元数据表里的写法或补零写法都行（ROI_6 / ROI_006），但必须是数据集里的 ROI
#   （写错编号会让生成失败，而不是悄悄丢掉这条）。
# - `details` 是逐 ROI 的补充，只显示在对应 ROI 的页面上。
#
# 这里只是先把已知的个案原样放进来，**不是研究结论**；深入的分析留给数据集特性研究。

[[issue]]
title = "与 ROI_060 重复（ROI_060 已删除）"
rois = ["ROI_37"]
text = """ROI_060 与本 ROI 是同一块地（同一条 Mini-RF 条带、同一幅 CE-2 分幅，152 个光学 patch 逐像素相同），\
2026-09-20 删除了 ROI_060、保留本 ROI。两边当年都做过评测真值点标注。"""
source = "删除清单；旧参考文档 `DATA_REFERENCE.md` §4"

[[issue]]
title = "明显的局部错位"
rois = ["ROI_8", "ROI_16", "ROI_25", "ROI_50", "ROI_52"]
text = """2026-09-11 的 patch 级配对检验（在每对 patch 上找光学与 SAR 的可信匹配、量两者的相对偏移，\
每个 ROI 按编号等间隔抽 24 对）把这几个 ROI 归为「明显错位」：patch 对的重叠面积中位数 66%~79%。\
偏移几乎都在 x 方向（横跨条带），y 方向基本为 0；错位程度与该 ROI 对齐控制点的拟合残差对得上。

这项检验只能当参考：它能证明一对 patch「是同一个地方」，证明不了「不是」。**待本人复核。**"""
source = "2026-09-11 数据核查会话（配对检验）"

[issue.details]
ROI_50 = "SAR 相对光学整体偏移约 −136 px，**约 1 km**；对齐控制点中位拟合残差 130 px。"
ROI_8 = "可信匹配里有 33% 的 patch 对错开超过半个 patch；对齐控制点中位拟合残差 161 px。"
ROI_16 = "对齐控制点中位拟合残差 128 px。"
ROI_52 = "对齐控制点中位拟合残差 96 px。"
ROI_25 = "对齐控制点中位拟合残差 92 px。"

