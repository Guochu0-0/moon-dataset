[[issue]]
title = "CE-2 分幅的投影参数被改错，读取时纠正"
rois = ["ROI_57", "ROI_58", "ROI_65", "ROI_70", "ROI_73"]
text = """本 ROI 所用的一幅 CE-2 分幅，随附投影文件的 `lat_ts` 抄成了相邻纬度带的值（E 带应为 35 却写成 21，\
I 带应为 −21 却写成 −35），像素和 geotransform 没动，整幅图因此被放到几度之外。旧代码在读取时按图幅名\
纠正，原文件不动；直接用通用 GIS 工具读原始瓦片会得到错误位置。"""
source = "旧迁移记录 `MIGRATION.md`；旧参考文档 `DATA_REFERENCE.md` §2"

